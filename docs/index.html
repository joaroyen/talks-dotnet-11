# Kjøremiljø

---

# Kjøremiljø: Generelle forbedringer

- Maskinvarekravene er oppdatert
  - Droppet support for gammel maskinvare uten nødvendig sikkerhet eller instruksjonssett
  - Kan nå kjøres på maskiner med mer enn 1024 prosessorer
- Ytterlige forbedringer i ahead-of-time kompilering

---

# Kjøremiljø: Forbedringer i async / await

- Async await i kjøremiljøet i stede for kompilator generert tilstands-maskin
    ```xml
    <PropertyGroup>
      <Features>runtime-async=on</Features>
    </PropertyGroup>
    ```
- Renere call-stack i alle situasjoner
- Bedre ytelse og lavere minnebruk
- .NET 11 bibliotekene bruker allerede disse forbedringene

# Biblioteker: Json linjer

```csharp
using var jsonlStream = new MemoryStream();
PipeWriter jsonlPipe = PipeWriter.Create(jsonlStream);

// Write JSON Lines (one value per line): 0\n1\n2\n3\n4\n
await JsonSerializer.SerializeAsyncEnumerable(
    jsonlPipe,
    [0, 1, 2, 3, 4],
    topLevelValues: true);
await jsonlPipe.CompleteAsync();

Resultat:
0
1
2
3
4
```

# Biblioteker: Prosesser

Enkel tilgang til de vanligste måten å kjøre og interagere med prosesser

- Resultat med standard output, error og exit code
- Fire-and-forget
- Sende Posix signaler

# Biblioteker: Strenger

- Metodevarianter i strengklasser tar nå inn unicode runer som argumenter
- `StringBuilder.MoveChunks()` flytter innhold uten kopiering og allokering av minne
- (Minimalt) raskere Base64-koding og dekoding med nye metode varianter

---

# Biblioteker: Tall

- IEEE 754 desimaltall
  - Standardiserte høyoppløselige desimaltall (32, 64 eller 128 bit)
  - Ikke helt det samme som vår eksisterende `Decimal` type
- Parsing av tall kan nå ignorere enheter (f.eks. "100px" eller "50kg")
- Representasjon av komplekse tall utover den eksisterende som bruker `Double`
- BFloat16 som brukes i maskinlæring og AI
- Generisk variant av pseudo-tilfeldige tall

---

# Biblioteker: LINQ forbedringer

FullJoin kompletterer de andre outer-join operasjonene i LINQ:

```c#
var products = new List<(int Id, string Name, string? Category)>
{
    (1, "Laptop", "Electronics"),
    (2, "Mouse", "Electronics"),
    (3, "Orphan", null), // No matching category
};
var categories = new List<(string Name, string Description)>
{
    ("Electronics", "Electronic devices"),
    ("Furniture", "Office furniture"), // No matching product
};

// FullJoin: all products and categories, paired where they match
var fullJoined = products.FullJoin(
    categories,
    p => p.Category,
    c => c.Name);

...    
```

# Bibliotek: LINQ forbedringer

FullJoin kompletterer de andre outer-join operasjonene i LINQ:

```c#

foreach (var (product, category) in fullJoined)
    Console.WriteLine(
        $"{product.Name ?? "(none)"}: {category.Description ?? "(none)"}");
// Laptop: Electronic devices
// Mouse: Electronic devices
// Orphan: (none)
// (none): Office furniture
```

# Biblioteker: Asynkron validering

```c#
public sealed class BackendOptionsValidator : IAsyncValidateOptions<BackendOptions>
{
    public async Task<ValidateOptionsResult> ValidateAsync(
        string? name, BackendOptions options, CancellationToken cancellationToken = default) =>
        await IsReachableAsync(options.HostName, cancellationToken)
            ? ValidateOptionsResult.Success
            : ValidateOptionsResult.Fail($"'{options.HostName}' isn't reachable.");

    // Source-generated validators also implement this synchronous fallback.
    public ValidateOptionsResult Validate(string? name, BackendOptions options) =>
        ValidateOptionsResult.Fail("Backend validation must run asynchronously.");
}
```

# Biblioteker: Kryptografi

- Eksperimentell støtte for "post-quantum" kryptografi

```c#
var suite = new HpkeSuite(HpkeKem.DHKEM_P256_HKDF_SHA256, HpkeKdf.HKDF_SHA256, HpkeAead.AES_128_GCM);
using var recipient = Hpke.GenerateKey(suite);
using var sender = Hpke.ImportEncapsulationKey(suite, recipient.ExportEncapsulationKey());
sender.Seal("Hello"u8, out byte[] encapsulatedSecret, out byte[] ciphertext);
byte[] plaintext = recipient.Open(encapsulatedSecret, ciphertext);
Console.WriteLine(Encoding.UTF8.GetString(plaintext));
```

# SDK: Solution filter

```bash
dotnet new slnf --parent-solution MySolution.slnx --name Tests
dotnet sln Tests.slnf add tests/Tests/Tests.csproj
dotnet sln Tests.slnf add src/Lib/Lib.csproj
dotnet sln Tests.slnf list
dotnet sln Tests.slnf remove src/Lib/Lib.csproj
```

---

# SDK: Forbedringer

- Redusert størrelse på Linux og macOS
- Redusert støy og bedre meldinger fra kodeanalyse
- Filbaserte apper
  - Støtte for inkludering av flere filer
  - Gjenbruk av kompilerte apper

---

# SDK: `dotnet` CLI

- Hybrid AOT
- Varm bygg server prosess
- `dotnet run` miljøvariabler
- `dotnet test`
  - Støtte for macOS, iOS og Android
  - Innebygde maler for xUnit v3

---

# SDK: NuGet

Konfigurer minimum alder på NuGet-pakker

```bash
dotnet nuget add source https://api.nuget.org/v3/index.json --name public --min-publish-age-hours 24 --configfile nuget.config
dotnet nuget update source public --min-publish-age-hours 48 --configfile nuget.config
```
---

# SDK: Kontainere

- Innebygd kontainerstøtte i operativsystemet brukes som standard på Windows (`wslc`) og macOS (`container`)
- Docker og PodMan fortsatt støttet som alternativer
- Deterministisk image digest
    ```bash
    dotnet publish /t:PublishContainer \
      -p:ContainerRegistry=registry.example.com \
      -p:SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
    ```

# ASP.NET Core: OpenAPI 3.2.0

- Inkonsistent dokumentasjon som både sier at OpenAPI 3.2.0 inneholder breaking change og er opt-in
- Et annet avsnitt sier at OpenAPI 3.2 er standard og at opt-in er for tidligere versjoner
- Ved tvil, velg den nyeste versjonen som standard.
    ```csharp
    builder.Services.AddOpenApi(options =>
    {
        options.OpenApiVersion = Microsoft.OpenApi.OpenApiSpecVersion.OpenApi3_2;
    });
    ```
